name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (as a new user would)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: CLI starts
        run: djtagger --version && djtagger --help
      - name: Tests
        run: pytest -q
